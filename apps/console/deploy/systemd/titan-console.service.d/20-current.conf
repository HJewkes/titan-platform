# Runs the console from the `current` symlink the self-updater swaps (TP-2258).
# Drop in beside the existing titan-console.service drop-ins; it replaces their ExecStart.
[Service]
# Node exits 0 on an empty cli.js, so this check runs first: it moves `current` off a build a power loss left
# empty, or fails the start with the reason (TP-4638). It is a copy outside every release; see docs/self-update.md.
ExecStartPre=/usr/bin/env node %h/.local/share/titan-console/bin/titan-console-start-check.mts
ExecStart=
ExecStart=/usr/bin/env node %h/.local/share/titan-console/current/apps/console/dist/cli.js
Environment=PATH=%h/.local/share/mise/shims:%h/.local/bin:/usr/bin:/bin:/usr/sbin:/sbin
