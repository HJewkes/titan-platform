# Daily briefing (video-profiles plan §B.4): BLUF. For now the daily gets the full audition and the
# same variety rules as the review videos (owner Q2 B), so it does not hold one house layout.
# kanban-flow, gantt and forecast wait for the beat-spec registry (TP-2867) and titan-design.
schema: type-profile/v1
type: daily-overview
version: 0.1.0
family: briefing
intent: "What the owner must know and decide today: the bottom line, the facts behind it, the decisions waiting, then the rest at speed."
audience: { default: owner-internal, allow: [owner-internal] }
inputs: { adapters: [gatherDaily], preconditions: [task-snapshot] }
runtime: { targetS: 150, minS: 120, maxS: 240, splitAboveS: 300 }
structure:
  order: heuristic
  heuristic:
    - { macro: scqa, ask: "Does the owner queue hold an old blocking item?" }
    - { macro: timeline, ask: "Did one event cascade through the day?" }
    - { macro: board-walk, ask: "Is the day best told as work moving across the board?" }
  fallback: bluf
  macros:
    bluf: [bottom-line, decisions, facts, segments, ask]
    scqa: [bottom-line, situation, decisions, ask]
    timeline: [bottom-line, day, decisions, ask]
    board-walk: [bottom-line, board, decisions, ask]
  blocks:
    - { id: bottom-line, goal: "The verdict of the day and how many items need the owner.", seconds: [10, 25], beats: [hook, claim-card, stat], require: [claim-card] }
    - { id: decisions, goal: "The top decisions, each with its recommendation.", seconds: [20, 50], beats: [list, claim-card] }
    - { id: facts, goal: "The two or three facts behind the bottom line.", seconds: [20, 50], beats: [stat, metrics-panel, chart] }
    - { id: situation, goal: "The blocking item and what waiting on it costs.", seconds: [20, 45], beats: [issue-pin, stat, history] }
    - { id: day, goal: "The day on a timeline, from the first event to its last effect.", seconds: [30, 70], beats: [history, sequence, chart] }
    - { id: board, goal: "Work moving across the board.", seconds: [30, 70], beats: [chart, list, metrics-panel] }
    - { id: segments, goal: "Background on demand: the remaining segments at speed, ranked by change.", seconds: [30, 80], beats: [fact-flash, chart, metrics-panel] }
    - { id: ask, goal: "What the owner does next, then the button to the digest.", seconds: [10, 20], beats: [button], require: [button] }
cuts: []
hook: "The bottom line and the count of items that need the owner, in the first 20 s."
ending: button
series:
  mayRepeat: [frame-chrome, intro-outro, house-look, captions, voice]
  mustVary: [structure, hook-kind, chapter-labels, close-kind, function-mix, component-histogram, framing-sequence, signature-layer, style-pack, stock-lines, lead-story, featured-visual]
audition: { k: 3, storyboardOnly: true }
layers: { customMin: 1, templateMaxShare: 0.85, componentMaxShare: 0.3 }
variety: { window: 5, minFramings: 3, ngram: 6, mode: warn }
pacing: { pictureChangeMaxS: 5, staticMaxS: 3, held: [1, 2], reHookS: [60, 90] }
coverage: [bottom-line, decisions-waiting, spend, merged-work]
