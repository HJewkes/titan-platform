  - id: Q-V10
    rule: "Every heteronym in spoken carries a reading declaration [w](=reading) or an override [w](/phonemes/), so a tagger change cannot flip it unheard"
    fields: [beats.spoken]
    owner_support: none
    l0: { severity: error, status: implemented, checks: ["Q-V10"], scope: chapter }
  - id: Q-V11
    rule: 'Spoken register sits in the human-explainer band: number mentions, "you", "we", sentence length mean and spread, contractions, triads, colon reveals, "Y, not X" tails (and "never X", "no X"), semicolons, "let''s", the over-represented phrases of doctrine/voice-phrases.json, verbless "no X" negation and downtoners, and at most one number mention in a beat'
    fields: [beats.spoken]
    related: [Q-V5, Q-V7, Q-V9]
    owner_support: none
    note: "Tracking, one warning row a metric (TP-3810). Bands are human-creator P25 to P90 from the TP-3765 script-tells research and live in src/lint-register.ts, never in a prompt. A script under 150 spoken words reports values without warning. register:shortest-last (TP-4308) is reported only, against chance, until a beat-level human band exists. register:neg-synthetic and register:downtoners (TP-4321) cap at the human P90 of the TP-4306 register research. Each row's status (gate, warning, report-only or drop) lives in doctrine/writing-check.json per length bucket (TP-4662); a row that is report-only or dropped at the script's own bucket reports its value without warning, and the rewrite pass neither targets nor protects it for human-ness. Noun density has no row: on that corpus it flags the scripts the contractions and second-person floors already flag."
    l0:
      severity: warning
      status: implemented
      checks: ["register:numbers", "register:second-person", "register:we", "register:sentence-mean", "register:sentence-cv", "register:contractions", "register:triads", "register:colon-reveals", "register:not-x-tails", "register:semicolons", "register:lets", "register:phrases", "register:neg-synthetic", "register:downtoners", "register:numbers-per-beat", "register:shortest-last"]

  - id: Q-V12
    rule: "Spoken lines carry numbers as words, never digits, so the voice and the word timings agree on what is said"
    fields: [beats.spoken]
    related: [Q-V11, Q-V14]
    owner_support: none
    note: "An error since TP-4327: every digit is a guess the voice makes out loud (PL-26)."
    l0: { severity: error, status: implemented, checks: ["Q-V12"], scope: chapter }
  - id: Q-V13
    rule: "A beat headline wraps to at most two lines at the width of the headline band, so the band never clips it"
    fields: [beats.visual.assertion]
    owner_support: none
    note: "The band is sized for two lines (TP-4105); the width estimate lives in src/lint-headline.ts."
    l0: { severity: error, status: implemented, checks: ["Q-V13"], scope: chapter }
  - id: Q-V14
    rule: "Spoken lines carry no print device (parentheses, slashes, e.g., i.e., etc., &, %, unit symbols), and every file path, code token and acronym in them has a spoken alias: a lexicon entry or a [word](/phonemes/) override"
    fields: [beats.spoken]
    related: [Q-V10, Q-V12]
    owner_support: none
    note: "TP-4327 (PL-32, PL-21, XT-13, XT-15). The token patterns live in src/lint-spoken-tokens.ts; a [word](=reading) declaration names a reading, not an alias, so it does not count."
    l0: { severity: error, status: implemented, checks: ["Q-V14"], scope: chapter }

