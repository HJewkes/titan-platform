# The Q-rule registry: one id space for every script-quality rule.
#
# Each rule is a hypothesis with a check, not a proven quality signal. `owner_support` moves
# from `none` to `for` or `against` as owner sessions rate scripts; a rule still at `none`
# after 3 sessions is demoted to a warning.
#
# `l0` is the deterministic check over the script and facts pack; `judge` is the L1 judge or
# the L2 viewer probe. A rule's check type is whichever of the two it has. Each one is either
# implemented (`checks`: the L0 check ids it emits; `rubric`: the file that cites it) or
# `pending` with the slice that owns it. `partial` lists check ids that already cover part
# of a pending rule.
#
# An implemented `l0` may set `scope: chapter` when its check measures each chapter's own beats
# and its verdict on a chapter does not depend on the chapters after it; a long script drafted one
# chapter per call repairs those per chapter. Every other rule is `video` (the default) and runs
# once on the joined script.
#
# `aliases` are the phase-1 ids (X, R, K, TC, SA, S) this rule absorbed; each resolves to one
# rule. An id merged into more than one rule is an alias of its main home and `related` on
# the others, alongside ids from other sources.
schema: rules/v1
rules:
  - id: Q-V1
    rule: 'No spoken process narration (review, audit, "we checked/traced", "worth reading", claims) after masking repo entities'
    fields: [beats.spoken]
    aliases: [X1, R18, K1, TC5, SA1, S1]
    related: ["CT R1", P14]
    rubric_dims: [B5, J1]
    owner_support: none
    l0: { severity: error, status: implemented, checks: ["Q-V1"], scope: chapter }
    judge: { layer: L1, status: pending, owner: SQ7 }
