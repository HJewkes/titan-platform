name: Codewatch metrics

# Full-tree metric rows for audits to cite (M4 A3); audits read the artifact, never a local graph.db.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: Repository under HJewkes to measure
        type: choice
        options: [titan-platform, titan-design, agent-chat]
        required: true
      ref:
        description: Branch, tag or sha of that repository
        type: string
        default: main
        required: true
      baseline_run:
        description: Run id of an earlier codewatch-metrics run to diff against (with baseline_sha256)
        type: string
        required: false
      baseline_sha256:
        description: sha256 of that run's codewatch-metrics.json (with baseline_run)
        type: string
        required: false

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      BASELINE_RUN: ${{ inputs.baseline_run }}
      BASELINE_SHA256: ${{ inputs.baseline_sha256 }}
    steps:
      - name: Require both baseline inputs or neither
        run: |
          if [ -n "$BASELINE_RUN" ] && [ -z "$BASELINE_SHA256" ]; then
            echo "::error::baseline_run needs baseline_sha256 too"; exit 1
          fi
          if [ -z "$BASELINE_RUN" ] && [ -n "$BASELINE_SHA256" ]; then
            echo "::error::baseline_sha256 needs baseline_run too"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Its own .git makes the target the id root, so rows carry paths relative to the measured repo.
      - uses: actions/checkout@v4
        with:
          repository: HJewkes/${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          path: target
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @titan-design/code-graph... run build
      - name: Resolve the target sha
        id: target
        run: echo "sha=$(git -C target rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Write the metric rows
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node scripts/codewatch-report.mjs full --tree target --out codewatch-metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: codewatch-metrics-${{ inputs.repo }}-${{ steps.target.outputs.sha }}
          path: codewatch-metrics.json
          if-no-files-found: error
      - name: Download the baseline metrics
        if: env.BASELINE_RUN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$BASELINE_RUN" --repo HJewkes/titan-platform --pattern 'codewatch-metrics-*' --dir baseline
      - name: Write the findings
        env:
          REPO: ${{ inputs.repo }}
        run: |
          args=(--repo "$REPO" --current codewatch-metrics.json --out codewatch-findings.json)
          if [ -n "$BASELINE_RUN" ]; then
            previous=$(find baseline -name codewatch-metrics.json)
            if [ "$(printf '%s\n' "$previous" | grep -c .)" -ne 1 ]; then
              echo "::error::expected one codewatch-metrics.json in run $BASELINE_RUN"; exit 1
            fi
            args+=(--previous "$previous" --previous-sha256 "$BASELINE_SHA256")
          fi
          node scripts/codewatch-findings.mjs "${args[@]}"
      - name: Print the file hashes
        run: |
          {
            echo "### Codewatch metrics"
            echo "- codewatch-metrics.json sha256: \`$(sha256sum codewatch-metrics.json | cut -d' ' -f1)\`"
            echo "- codewatch-findings.json sha256: \`$(sha256sum codewatch-findings.json | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: codewatch-findings-${{ inputs.repo }}-${{ steps.target.outputs.sha }}
          path: codewatch-findings.json
          if-no-files-found: error
