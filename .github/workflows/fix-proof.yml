name: fix-proof

# pull_request only, never pull_request_target: the PR's code runs here with a read-only token and no secrets.
#
# Three jobs, so no PR-head code can reach the verdict. fix-proof-base and fix-proof-head each build and test one side
# and pass encoded reports on as job outputs. fix-proof, the check run Shepherd reads, runs only code built from the
# merge base: it decodes those reports and prints the one result line. A head process cannot write into another job's
# VM, outputs or log.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fix-proof-${{ github.ref }}
  cancel-in-progress: true

# onnxruntime-node would otherwise fetch CUDA binaries on install; no job uses them.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  # Laid out like the judge: the head goes to src/ and every tool comes from the merge-base tree in runner/. With the
  # head at the workspace root, pnpm/action-setup would install the head's packageManager and copy its .npmrc, and
  # that pnpm would build the runner and run the base side's vitest.
  fix-proof-base:
    # The Version Packages PR only bumps versions and changelogs, so it has no fix to prove. Every job skips, the judge
    # included, so no judge prints an error verdict from reports that never came. A fork's branch of that name still runs.
    if: github.head_ref != 'changeset-release/main' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      report: ${{ steps.emit.outputs.report }}
      rerun: ${{ steps.emit.outputs.rerun }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR head, not GitHub's synthetic merge commit; full history so the merge base is reachable.
          ref: ${{ github.event.pull_request.head.sha }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      # The script comes from the workflow's own commit (the PR merge ref), not the PR head: a head branched before
      # the script existed has no copy of it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .fix-proof-workflow
          sparse-checkout: scripts/fix-proof-run.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The event's base sha, not the moving base branch, so all three jobs agree on the merge base. A stacked PR's base
      # is a parent branch any agent can push, so its tree would supply the plan's config and the judge's own source:
      # the script refuses any base but the default branch, and no runner step runs without the sha it writes. The sha
      # check keeps an option-shaped value away from git.
      - name: Find the merge base
        id: merge-base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ $BASE_SHA =~ ^[0-9a-f]{40}$ && $HEAD_SHA =~ ^[0-9a-f]{40}$ ]] || { echo "fix-proof: base or head is not a commit sha" >&2; exit 1; }
          bash .fix-proof-workflow/scripts/fix-proof-run.sh merge-base src "$BASE_SHA" "$HEAD_SHA"
      - name: Check out the runner at the merge base
        if: steps.merge-base.outputs.sha != ''
        env:
          MERGE_BASE: ${{ steps.merge-base.outputs.sha }}
        run: git -C src worktree add --detach "$GITHUB_WORKSPACE/runner" "$MERGE_BASE"
      - uses: pnpm/action-setup@v4
        if: steps.merge-base.outputs.sha != ''
        with:
          package_json_file: runner/package.json
      # No cache: fix-proof-head shares the key and can save a store its install tampered with, which a later base
      # run would restore into the merge-base runner and vitest.
      - uses: actions/setup-node@v4
        if: steps.merge-base.outputs.sha != ''
        with:
          node-version-file: runner/.node-version
      - name: Build the runner at the merge base
        if: steps.merge-base.outputs.sha != ''
        working-directory: runner
        env:
          TURBO_TELEMETRY_DISABLED: 1
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @titan-design/fix-proof... run build
      # The runner builds the merge base before it overlays any head file, then runs the head's tests on it twice.
      - name: Run the base side
        if: steps.merge-base.outputs.sha != ''
        env:
          MERGE_BASE: ${{ steps.merge-base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TURBO_TELEMETRY_DISABLED: 1
        run: bash .fix-proof-workflow/scripts/fix-proof-run.sh exec base "$GITHUB_WORKSPACE/runner" "$GITHUB_WORKSPACE/src" "$MERGE_BASE" "$HEAD_SHA" "$RUNNER_TEMP/fix-proof-out"
      - name: Pass the reports to the judge
        id: emit
        if: ${{ !cancelled() }}
        run: bash .fix-proof-workflow/scripts/fix-proof-run.sh emit base "$RUNNER_TEMP/fix-proof-out"

  fix-proof-head:
    if: github.head_ref != 'changeset-release/main' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      report: ${{ steps.emit.outputs.report }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .fix-proof-workflow
          sparse-checkout: scripts/fix-proof-run.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The same refusing merge base as fix-proof-base, before anything reads the runner tree.
      - name: Find the merge base
        id: merge-base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ $BASE_SHA =~ ^[0-9a-f]{40}$ && $HEAD_SHA =~ ^[0-9a-f]{40}$ ]] || { echo "fix-proof: base or head is not a commit sha" >&2; exit 1; }
          bash .fix-proof-workflow/scripts/fix-proof-run.sh merge-base . "$BASE_SHA" "$HEAD_SHA"
      - uses: pnpm/action-setup@v4
        if: steps.merge-base.outputs.sha != ''
      - uses: actions/setup-node@v4
        if: steps.merge-base.outputs.sha != ''
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Build the runner at the merge base
        if: steps.merge-base.outputs.sha != ''
        env:
          MERGE_BASE: ${{ steps.merge-base.outputs.sha }}
          TURBO_TELEMETRY_DISABLED: 1
        run: |
          git worktree add --detach "$RUNNER_TEMP/runner" "$MERGE_BASE"
          cd "$RUNNER_TEMP/runner"
          pnpm install --frozen-lockfile
          pnpm --filter @titan-design/fix-proof... run build
      # Head install, build and vitest run here, and nothing this job does can reach the judge but its report output.
      - name: Run the head side
        if: steps.merge-base.outputs.sha != ''
        env:
          MERGE_BASE: ${{ steps.merge-base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TURBO_TELEMETRY_DISABLED: 1
        run: bash .fix-proof-workflow/scripts/fix-proof-run.sh exec head "$RUNNER_TEMP/runner" "$GITHUB_WORKSPACE" "$MERGE_BASE" "$HEAD_SHA" "$RUNNER_TEMP/fix-proof-out"
      - name: Pass the report to the judge
        id: emit
        if: ${{ !cancelled() }}
        run: bash .fix-proof-workflow/scripts/fix-proof-run.sh emit head "$RUNNER_TEMP/fix-proof-out"

  # The check run Shepherd reads. No cache: a store saved by fix-proof-head must not reach it. Every tool and dependency
  # comes from the merge-base tree in runner/; the head checkout in src/ is only read by git, never built or run.
  fix-proof:
    needs: [fix-proof-base, fix-proof-head]
    if: ${{ !cancelled() && (github.head_ref != 'changeset-release/main' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .fix-proof-workflow
          sparse-checkout: scripts/fix-proof-run.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The same refusing merge base as fix-proof-base, before anything reads the runner tree.
      - name: Find the merge base
        id: merge-base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ $BASE_SHA =~ ^[0-9a-f]{40}$ && $HEAD_SHA =~ ^[0-9a-f]{40}$ ]] || { echo "fix-proof: base or head is not a commit sha" >&2; exit 1; }
          bash .fix-proof-workflow/scripts/fix-proof-run.sh merge-base src "$BASE_SHA" "$HEAD_SHA"
      - name: Check out the runner at the merge base
        if: steps.merge-base.outputs.sha != ''
        env:
          MERGE_BASE: ${{ steps.merge-base.outputs.sha }}
        run: git -C src worktree add --detach "$GITHUB_WORKSPACE/runner" "$MERGE_BASE"
      - uses: pnpm/action-setup@v4
        if: steps.merge-base.outputs.sha != ''
        with:
          package_json_file: runner/package.json
      - uses: actions/setup-node@v4
        if: steps.merge-base.outputs.sha != ''
        with:
          node-version-file: runner/.node-version
      - name: Build the judge at the merge base
        if: steps.merge-base.outputs.sha != ''
        working-directory: runner
        env:
          TURBO_TELEMETRY_DISABLED: 1
        run: |
          pnpm install --frozen-lockfile --filter @titan-design/fix-proof...
          pnpm --filter @titan-design/fix-proof... run build
      # toJSON keeps a forged multi-line output on one line where the step log echoes its env block.
      - name: Receive the reports
        if: steps.merge-base.outputs.sha != ''
        env:
          REPORT_BASE: ${{ toJSON(needs.fix-proof-base.outputs.report) }}
          REPORT_BASE_RERUN: ${{ toJSON(needs.fix-proof-base.outputs.rerun) }}
          REPORT_HEAD: ${{ toJSON(needs.fix-proof-head.outputs.report) }}
        run: bash .fix-proof-workflow/scripts/fix-proof-run.sh receive "$RUNNER_TEMP/fix-proof-reports"
      # The verdict is the printed fix-proof/v1 line and the judge always exits 0. A report that failed to arrive is an
      # error verdict, so this runs whatever the steps before it did.
      - name: Judge the proof
        if: ${{ !cancelled() }}
        env:
          # A refusal writes no sha, so its error line names the event's base instead.
          MERGE_BASE: ${{ steps.merge-base.outputs.refused && github.event.pull_request.base.sha || steps.merge-base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FIX_PROOF_REFUSED: ${{ steps.merge-base.outputs.refused }}
        run: bash .fix-proof-workflow/scripts/fix-proof-run.sh judge "$GITHUB_WORKSPACE/runner" "$GITHUB_WORKSPACE/src" "$MERGE_BASE" "$HEAD_SHA" "$RUNNER_TEMP/fix-proof-reports"
