name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request's newer head cancels its older run. Main pushes share one group without cancel-in-progress: the running
# main CI finishes and saves the caches, and a newer push replaces only a run still queued behind it. The newer run
# contains the replaced push, and Release acts only on the tip, so nothing goes untested or unreleased; Shepherd reads
# a merge whose queued run was replaced on the newer push.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || 'main-push' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# onnxruntime-node would otherwise fetch CUDA binaries on install; no job uses them.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  validate:
    runs-on: ubuntu-latest
    # Green runs take 30 to 72 minutes; a hung test step once sat 74 minutes past its last file (TP-4287).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # The changeset guard diffs against origin/<base>, which a shallow clone lacks.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the toolchain against the canonical declarations
        run: pnpm env:doctor
      # Turbo replays a package's build or typecheck when its inputs hash the same. Only main saves; PRs restore main's cache.
      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-
      - run: pnpm build
        env:
          TURBO_TELEMETRY_DISABLED: 1
      # A merge gate, not an egress control: a pushed branch is public before this runs. The pre-push hook is the control.
      # The build above produced the scanner and fails loudly, unlike prepare. The full-history checkout gives it every commit in the range.
      # The PR head sha, not the merge ref, so GitHub's synthetic merge commit is not scanned. CI has no term list.
      - name: Scan the pushed commits
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: pnpm egress:scan range "$BASE_SHA" "$HEAD_SHA"
      # Findings at warn level never fail the job; an unreadable rule file does (exit 2). .github/merge-lint.json holds the allowlist.
      - name: Flag merge calls outside the logged wrappers
        run: pnpm merge:lint
      # A sidecar whose find no longer occurs in its target would make fix-proof refuse a later, unrelated PR (TP-4439).
      - name: Check mutation sidecar finds against their targets
        run: pnpm sidecar:finds
      - run: pnpm typecheck
        env:
          TURBO_TELEMETRY_DISABLED: 1
      - name: Save turbo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
      # Content strategy keys the cache on file contents, so a fresh checkout's mtimes do not matter. Only main saves.
      # eslint cannot see edits to the workspace plugin's rules, so its source is part of the key.
      - name: Restore eslint cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache/lint
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/eslint-plugin/src/**') }}-${{ github.sha }}
          restore-keys: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/eslint-plugin/src/**') }}-
      - run: pnpm lint
      - name: Save eslint cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: node_modules/.cache/lint
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/eslint-plugin/src/**') }}-${{ github.sha }}
      # Vitest orders files by the last run's durations; restoring main's results starts the slowest first.
      # It only orders files, so a miss leaves the step as it was and a hit never skips a test.
      - name: Restore vitest results
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.vite/vitest
          key: vitest-results-${{ runner.os }}-${{ github.sha }}
          restore-keys: vitest-results-${{ runner.os }}-shard1of3-
      # redirect-corpus.test.ts needs real bash and zsh; the explainer render tests spawn real ffmpeg/ffprobe.
      # The debs are cached per runner image, so a hit installs from disk with no apt-get update or download (TP-4400).
      # A miss downloads; only main saves, because a hit installs the debs as root with no signature check,
      # so a pull request must never write the cache a later run trusts. Pull requests hit main's save.
      - name: Read the runner image version
        id: image
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore the zsh and ffmpeg debs
        id: debs
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-debs-zsh-ffmpeg-${{ runner.os }}-${{ steps.image.outputs.version }}
      - name: Download the zsh and ffmpeg debs
        if: steps.debs.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/apt-debs/partial
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends --download-only -o APT::Sandbox::User=root -o Dir::Cache::archives="$HOME/apt-debs" zsh ffmpeg
          sudo chmod -R a+rX ~/apt-debs
      - name: Install zsh and ffmpeg
        run: sudo dpkg -i "$HOME"/apt-debs/*.deb
      - name: Save the zsh and ffmpeg debs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: apt-debs-zsh-ffmpeg-${{ runner.os }}-${{ steps.image.outputs.version }}
      # frame-capture's tests drive a real headless Chromium, at the revision its pinned playwright-core expects.
      # The browser is cached per playwright-core version; --with-deps still installs the system libraries each run.
      - name: Read the playwright-core version
        id: playwright
        run: |
          version=$(pnpm --filter @titan-design/frame-capture exec node -p "require('playwright-core/package.json').version")
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "could not read the playwright-core version (got '$version')" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore the Chromium cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for frame-capture
        run: pnpm --filter @titan-design/frame-capture exec playwright-core install --with-deps --only-shell chromium
      - name: Save the Chromium cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # A pull request runs the packages its diff reaches through the workspace graph. Main runs everything, but in the
      # test-shard job below, in parallel with this one, so this step is pull-request only (TP-4401).
      - name: Run the tests in scope
        if: github.event_name == 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm test:scope --run
      # Per-file collect, setup and test time from scripts/vitest-file-timing.mjs; a none scope writes no file.
      - name: Upload the vitest file timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-file-timing-${{ github.run_attempt }}
          path: vitest-file-timing.json
          if-no-files-found: ignore
      # CAPABILITIES.md and site/guides/capabilities.md are committed; a stale copy fails here.
      - run: pnpm capabilities:check
      - run: pnpm metrics:check
      # Drift in agent-chat's roots only warns here: agent-chat moves independently, so it must not redden this required check.
      # On a PR, --base limits the per-file defaulted notices to files the PR adds or changes; the agent-chat clone is a depth-1 main, so it has no base.
      - name: Check the sunset manifest against agent-chat main
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git clone --depth 1 https://github.com/HJewkes/agent-chat "$RUNNER_TEMP/agent-chat"
          echo "agent-chat main: $(git -C "$RUNNER_TEMP/agent-chat" rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          node scripts/sunset-manifest.mjs check --agent-chat "$RUNNER_TEMP/agent-chat" --agent-chat-drift warn ${BASE_SHA:+--base "$BASE_SHA"}
      # Unfiltered, unlike pages.yml's PR trigger: a package added without
      # site/reference/<name>.md has to redden the required check, not the deploy.
      - run: pnpm docs:build
      # The Version Packages PR consumes the changesets, so this step can never pass there.
      - name: Require a changeset for package changes
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
      # The strict branch rule re-runs this on every update to the base, so the comparison is against main at merge time.
      - name: Require a fresh INDEX_VERSION when a PR bumps it
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm index-version:check

  # Main's full suite as three parallel shards beside validate, so main's wall time is the slowest of them (TP-4401).
  # Pull requests keep the scoped single-job run in validate. Branch protection requires validate, which a pull request
  # still runs. Shepherd judges main by the required contexts, so each shard is listed under mainContexts in
  # .github/required-checks.json and a red shard still freezes main; renaming the job or the matrix must update that list.
  # Each shard repeats install, a turbo-cached build,
  # the debs and Chromium; the restore-key fallback to the previous main's turbo cache makes the build a replay.
  test-shard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-
      - run: pnpm build
        env:
          TURBO_TELEMETRY_DISABLED: 1
      - name: Restore vitest results
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.vite/vitest
          key: vitest-results-${{ runner.os }}-shard${{ matrix.shard }}of3-${{ github.sha }}
          restore-keys: vitest-results-${{ runner.os }}-shard${{ matrix.shard }}of3-
      - name: Read the runner image version
        id: image
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore the zsh and ffmpeg debs
        id: debs
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-debs-zsh-ffmpeg-${{ runner.os }}-${{ steps.image.outputs.version }}
      - name: Download the zsh and ffmpeg debs
        if: steps.debs.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/apt-debs/partial
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends --download-only -o APT::Sandbox::User=root -o Dir::Cache::archives="$HOME/apt-debs" zsh ffmpeg
          sudo chmod -R a+rX ~/apt-debs
      - name: Install zsh and ffmpeg
        run: sudo dpkg -i "$HOME"/apt-debs/*.deb
      - name: Read the playwright-core version
        id: playwright
        run: |
          version=$(pnpm --filter @titan-design/frame-capture exec node -p "require('playwright-core/package.json').version")
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "could not read the playwright-core version (got '$version')" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore the Chromium cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for frame-capture
        run: pnpm --filter @titan-design/frame-capture exec playwright-core install --with-deps --only-shell chromium
      # The same reporters scripts/test-scope.mjs passes on CI (CI_REPORTERS), so a hang still fails and names its file.
      - name: Run this shard of the full suite
        run: >
          pnpm exec vitest run --passWithNoTests
          --reporter=default --reporter=hanging-process --reporter=./scripts/vitest-file-watchdog.mjs
          --reporter=./scripts/vitest-file-timing.mjs
          --shard=${{ matrix.shard }}/3
      - name: Upload the vitest file timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-file-timing-shard${{ matrix.shard }}of3-${{ github.run_attempt }}
          path: vitest-file-timing.json
          if-no-files-found: ignore
      - name: Save vitest results
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: node_modules/.vite/vitest
          key: vitest-results-${{ runner.os }}-shard${{ matrix.shard }}of3-${{ github.sha }}

  dag-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A full build, not just the indexer's, because lint:types below reads every package's types from dist. Main's
      # turbo cache makes it a replay; only validate saves that cache.
      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-
      - name: Build
        id: build
        run: pnpm build
        env:
          TURBO_TELEMETRY_DISABLED: 1
      # The indexer re-parses only files that changed since the cached graph (a cold head index is ~250 s).
      # The key covers the indexer's own code, so a schema or extractor change misses; the ISO week in the
      # key and the restore-key bounds a stale chain to a week, so each week's first main run indexes cold.
      # Source only: after the build, node_modules and dist sit under the same package directories.
      # A pull request may also seed from any graph at the same INDEX_VERSION, so a lockfile-only merge no longer
      # sends every PR cold until main saves; the indexer refuses a basis from another version. Main stays exact.
      - name: Compute the cache key
        id: key
        env:
          SOURCE_HASH: ${{ hashFiles('packages/code-graph/src/**', 'packages/code-graph/package.json', 'packages/code-parser/src/**', 'packages/code-parser/package.json', 'packages/embed/src/**', 'packages/retrieval/src/**', 'packages/store-sqlite/src/**', 'scripts/dag-check-self.mjs', 'pnpm-lock.yaml') }}
        run: |
          iv=$(sed -n 's/^export const INDEX_VERSION = "\([0-9.]*\)";$/\1/p' packages/code-graph/src/indexer.ts)
          test -n "$iv"
          echo "version=dag-graph-iv$iv-" >> "$GITHUB_OUTPUT"
          echo "prefix=dag-graph-iv$iv-$SOURCE_HASH-$(date -u +%G-%V)-" >> "$GITHUB_OUTPUT"
      - name: Restore the dag-check graph
        id: graph-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/graph.db
          key: ${{ steps.key.outputs.prefix }}${{ github.sha }}
          restore-keys: |
            ${{ steps.key.outputs.prefix }}
            ${{ github.event_name == 'pull_request' && steps.key.outputs.version || '' }}
      - name: Check the package DAG
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: pnpm dag:check:graph --report "$RUNNER_TEMP/codewatch-report.json" --db "$RUNNER_TEMP/graph.db" --seed-db "$RUNNER_TEMP/graph.db"
      # Only main saves, so a pull request never writes a graph built from an unmerged tree.
      - name: Save the dag-check graph
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.graph-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/graph.db
          key: ${{ steps.key.outputs.prefix }}${{ github.sha }}
      # On a pull request the report's head is GitHub's merge commit (the tree dag-check indexed), not the PR head.
      - name: Summarize the codewatch report
        if: always()
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/codewatch-summary.mjs "$RUNNER_TEMP/codewatch-report.json" >> "$GITHUB_STEP_SUMMARY"
          node scripts/codewatch-summary.mjs --annotate "$RUNNER_TEMP/codewatch-report.json"
          if [ -n "$PR_HEAD_SHA" ]; then echo "" >> "$GITHUB_STEP_SUMMARY"; echo "Head is the merge of PR head \`${PR_HEAD_SHA:0:12}\` into the base." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload the codewatch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codewatch-report
          path: ${{ runner.temp }}/codewatch-report.json
          retention-days: 30
          if-no-files-found: warn
      # Blocking: a new dead export fails the step (TP-1406).
      # BASE_REF also fails the step if the PR adds an entry to the shrink-only baseline.
      # Reads the head graph dag-check kept, instead of indexing the tree a second time.
      - name: Check for exports with no importer
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: pnpm dead:check --db "$RUNNER_TEMP/graph.db"
      # Type-aware rules (eslint.typed.config.js) need a TypeScript program per tsconfig, so they run beside the syntax
      # lint, not in it. A step here rather than its own job saves a second checkout, install and build; it runs after a
      # red DAG step too, so one push reports both.
      - name: Lint with type-aware rules
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm lint:types

  # Per-RPC budgets for the console's reads (TP-4403 d1), alone on a runner so no other test's CPU skews the medians.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
        env:
          TURBO_TELEMETRY_DISABLED: 1
      - name: Check the console's read budgets
        run: pnpm vitest run --project perf
        env:
          TITAN_BENCH: "1"

  # A required check must always report, so the job always runs and a pull request touching none of its inputs is a no-op.
  hub-compose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/hub
    steps:
      - uses: actions/checkout@v4
        with:
          # On a pull request HEAD is GitHub's merge commit, so HEAD^1 is the base tip and the diff is the PR's own change.
          fetch-depth: 2
      # The inputs are deploy/hub and what core.Dockerfile.dockerignore lets into the image's build context; keep the two in step.
      # A here-string, not a pipe: under pipefail an early grep -q exit can SIGPIPE printf and read as no match.
      - name: Find changed hub inputs
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          inputs='^(deploy/hub/|packages/(matrix-bus|egress-scan|eslint-plugin|fix-proof|rpc-protocol|worktree)/|(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json)$)'
          if grep -qE "$inputs" <<< "$changed"; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - name: Report a no-op
        if: steps.changes.outputs.run != 'true'
        run: echo "No hub input changed; compose checks skipped." >> "$GITHUB_STEP_SUMMARY"
      # The base image is cached under its pinned digest so a hit makes no registry request: ECR Public's anonymous quota 429s too.
      - name: Read the pinned base image
        id: base
        if: steps.changes.outputs.run == 'true'
        run: |
          image=$(sed -n 's/^ARG NODE_IMAGE=//p' core.Dockerfile)
          if [[ "$image" != *@sha256:* ]]; then echo "::error::core.Dockerfile NODE_IMAGE is not pinned by digest"; exit 1; fi
          digest=${image##*@}
          name=${image%@*}
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pull=${name%:*}@$digest" >> "$GITHUB_OUTPUT"
      - name: Restore base image
        id: restore
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/node-base.tar
          key: hub-node-base-${{ steps.base.outputs.digest }}
      - name: Load or pull base image
        if: steps.changes.outputs.run == 'true'
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          PULL: ${{ steps.base.outputs.pull }}
          DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          tar="$RUNNER_TEMP/node-base.tar"
          if [ "$CACHE_HIT" = true ]; then
            docker load -i "$tar"
            echo "Loaded base from cache key hub-node-base-$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          source="$PULL"
          docker pull "$source" || { source="mirror.gcr.io/library/node@$DIGEST"; docker pull "$source"; }
          docker tag "$source" titan-hub-node-base:ci
          docker save titan-hub-node-base:ci -o "$tar"
          echo "Pulled base from $source" | tee -a "$GITHUB_STEP_SUMMARY"
      # setup.sh writes the sample .env and data/run that the compose file interpolates and mounts.
      - if: steps.changes.outputs.run == 'true'
        run: printf 'SERVER_NAME=tp301.local\nPUBLIC_BASE_URL=https://tp301.local\n' > .env && ./scripts/setup.sh
      - if: steps.changes.outputs.run == 'true'
        run: docker compose config --quiet
      - if: steps.changes.outputs.run == 'true'
        run: docker compose --profile remote --profile core config --quiet
      - if: steps.changes.outputs.run == 'true'
        run: docker compose --profile core build --build-arg NODE_IMAGE=titan-hub-node-base:ci core
      - name: Save base image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changes.outputs.run == 'true' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/node-base.tar
          key: hub-node-base-${{ steps.base.outputs.digest }}
