name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changeset guard diffs against origin/<base>, which a shallow clone lacks.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Unfiltered, unlike pages.yml's PR trigger: a package added without
      # site/reference/<name>.md has to redden the required check, not the deploy.
      - run: pnpm docs:build
      # The Version Packages PR consumes the changesets, so this step can never pass there.
      - name: Require a changeset for package changes
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}

  dag-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @titan-design/code-graph... run build
      - name: Check the package DAG
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: pnpm dag:check

  hub-compose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/hub
    steps:
      - uses: actions/checkout@v4
      # setup.sh writes the sample .env and data/run that the compose file interpolates and mounts.
      - run: printf 'SERVER_NAME=tp301.local\nPUBLIC_BASE_URL=https://tp301.local\n' > .env && ./scripts/setup.sh
      - run: docker compose config --quiet
      - run: docker compose --profile remote --profile core config --quiet
      - run: docker compose --profile core build core
