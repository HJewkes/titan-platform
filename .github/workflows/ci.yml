name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changeset guard diffs against origin/<base>, which a shallow clone lacks.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # CAPABILITIES.md and site/guides/capabilities.md are committed; a stale copy fails here.
      - run: pnpm capabilities:check
      # Unfiltered, unlike pages.yml's PR trigger: a package added without
      # site/reference/<name>.md has to redden the required check, not the deploy.
      - run: pnpm docs:build
      # The Version Packages PR consumes the changesets, so this step can never pass there.
      - name: Require a changeset for package changes
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}

  dag-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @titan-design/code-graph... run build
      - name: Check the package DAG
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: pnpm dag:check --report "$RUNNER_TEMP/codewatch-report.json"
      # On a pull request the report's head is GitHub's merge commit (the tree dag-check indexed), not the PR head.
      - name: Summarize the codewatch report
        if: always()
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/codewatch-summary.mjs "$RUNNER_TEMP/codewatch-report.json" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_HEAD_SHA" ]; then echo "Head is the merge of PR head \`${PR_HEAD_SHA:0:12}\` into the base." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload the codewatch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codewatch-report
          path: ${{ runner.temp }}/codewatch-report.json
          retention-days: 30
          if-no-files-found: warn
      # Report-only until the false-positive count is reviewed (TP-970); then drop the flag to fail on a new dead export.
      # BASE_REF fails the step now, report-only or not, if the PR adds an entry to the shrink-only baseline.
      - name: Check for exports with no importer
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: pnpm dead:check --report-only

  # A merge gate, not an egress control: a pushed branch is public before this runs. The pre-push hook is the control.
  egress-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan reads every commit in the range, not only its endpoints.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # prepare also builds it but swallows a failure; this step fails loudly.
      - run: pnpm --filter @titan-design/egress-scan run build
      # The PR head sha, not the merge ref, so GitHub's synthetic merge commit is not scanned. CI has no term list.
      - name: Scan the pushed commits
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: pnpm egress:scan range "$BASE_SHA" "$HEAD_SHA"

  hub-compose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/hub
    steps:
      - uses: actions/checkout@v4
      # setup.sh writes the sample .env and data/run that the compose file interpolates and mounts.
      - run: printf 'SERVER_NAME=tp301.local\nPUBLIC_BASE_URL=https://tp301.local\n' > .env && ./scripts/setup.sh
      - run: docker compose config --quiet
      - run: docker compose --profile remote --profile core config --quiet
      - run: docker compose --profile core build core
