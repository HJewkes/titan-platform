name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  dag-check:
    runs-on: ubuntu-latest
    env:
      # codewatch is not on npm; build a pinned checkout and point the check at its CLI.
      CODEWATCH_REF: main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: HJewkes/codewatch
          ref: ${{ env.CODEWATCH_REF }}
          path: .codewatch-tool
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build codewatch
        working-directory: .codewatch-tool
        run: pnpm install --frozen-lockfile && pnpm build
      - run: pnpm install --frozen-lockfile
      - name: Check the package DAG
        env:
          CODEWATCH_CLI: ${{ github.workspace }}/.codewatch-tool/packages/cli/dist/index.js
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: scripts/dag-check.sh
