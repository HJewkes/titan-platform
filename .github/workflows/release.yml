name: Release

# Changesets flow: every merge to main either refreshes the "Version Packages" PR
# (when changesets are pending) or, once that PR is merged, publishes the bumped
# packages to npm. The workflow is not token-free: a GitHub App installation token
# pushes the release branch and opens the PR, because pushes made with GITHUB_TOKEN
# start no workflows and the required checks would never run. The App's commits are
# also attributed to the App, which the ruleset's unattributed-change rule needs.
# npm publishing still authenticates through trusted publishing (OIDC), so no
# NPM_TOKEN secret exists; each package needs a trusted publisher on npmjs.com
# pointing at this repo and this workflow file. npm will not accept one for a
# package it has never seen, so a brand-new package's first version is published once
# by hand from the owner's own terminal (see CLAUDE.md). Setup: site/guides/autonomous-loop-setup.md.
#
# Release runs after a green CI run for a push to main, so it doesn't repeat CI's
# build, typecheck, lint and test. Every main push's CI run that is not replaced
# while queued completes and starts a Release run. A run for a sha that is no longer
# the main tip skips its job, and a queued run a newer one replaces never starts;
# pending changesets stay pending either way, so the next Release for the tip
# releases them.
#
# Each refresh of the Version Packages PR pushes a head that runs full CI, so a burst
# of merges refreshes it at most once per 30 minutes. The hourly schedule picks up a
# refresh the debounce skipped once merges stop. Publishing is never debounced: with
# no pending changeset on a green tip the action publishes, from either trigger. Both
# share the concurrency group below, so a scheduled run that replaces a queued publish
# run publishes in its place.
#
# A version can still strand: if the CI run for a Version Packages merge is cancelled by a
# newer push, and that push carries a changeset, every later run versions instead of
# publishing. A manual dispatch on main publishes those: once CI is green at the tip it
# runs scripts/release-stranded.mjs, which publishes every public version npm lacks, with
# no `changeset version`, no git tags and no GitHub releases. A package npm has never seen,
# and any package that depends on one, is skipped and reported, since trusted publishing
# needs its first hand publish. The dispatch lives in this file because each npm trusted
# publisher names this workflow file. dry_run (the default) lists what would publish:
#   gh workflow run release.yml --ref main -f dry_run=true
#   gh workflow run release.yml --ref main -f dry_run=false
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List the stranded versions and publish nothing
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# onnxruntime-node would otherwise fetch CUDA binaries on install; no job uses them.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  release:
    # changesets/action bases the version commit and the release tags on github.sha,
    # the main tip when the event fired. Requiring that it is the sha CI validated
    # keeps the commit and the tags on code that passed. If a newer push landed first,
    # its own CI run triggers the next Release.
    # The gate step holds a scheduled or dispatched run to the same bar: a green push CI run at the tip.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      # The full-history checkout carries origin/changeset-release/main, the Version Packages PR's branch. The runner's own
      # node runs the gate, which needs no dependency, so a skipped run installs nothing.
      - name: Decide whether to version or publish now
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          TIP: ${{ github.sha }}
        run: node scripts/release-gate.mjs
      - if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1. Pinned to 11.x whatever npm .node-version bundles:
      # changesets passes pnpm's --git-checks to npm publish, which npm 12 rejects outright.
      - if: steps.gate.outputs.run == 'true'
        run: npm install -g npm@11 && npm --version
      # No build here: `pnpm release` builds before `changeset publish`, and
      # `pnpm version-packages` reads package sources, not dist.
      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.run == 'true' && github.event_name == 'workflow_dispatch'
        name: Publish stranded versions
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/release-stranded.mjs
      - if: steps.gate.outputs.run == 'true' && github.event_name != 'workflow_dispatch'
        name: Version packages or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "Version Packages"
          commit: "Version packages"
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
