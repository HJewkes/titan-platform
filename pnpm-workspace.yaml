packages:
  - "packages/*"
  - "products/*"
  - "apps/*"
  - "deploy/hub"

# pnpm 10 runs no dependency install scripts unless named here. The tree-sitter grammars
# load as .wasm (see packages/code-parser/README.md), protobufjs's script only prints, and
# onnxruntime-node ships its CPU runtime; its script only swaps in the Linux CUDA build.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: true
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-typescript: false
